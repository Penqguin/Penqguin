name: Update profile stats

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch totals from GitHub API
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          COMMITS=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/search/commits?q=author:Penqguin" | jq -r .total_count)
          PRS=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/search/issues?q=author:Penqguin+is:pr" | jq -r .total_count)
          jq -n --arg c "$COMMITS" --arg p "$PRS" \
            '{commits: ($c | tonumber), prs: ($p | tonumber)}' > data/stats.json

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/stats.json
          git diff --cached --quiet || git commit -m "chore: update stats"
          git push
